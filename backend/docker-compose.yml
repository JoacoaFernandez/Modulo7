services:
  postgres:
    image: postgres:16-alpine
    container_name: analitica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: analitica
      POSTGRES_PASSWORD: analitica
      POSTGRES_DB: analitica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
